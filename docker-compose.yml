services:
  ezptt:
    image: doublehub/ezptt:latest
    container_name: ezptt
    restart: unless-stopped
    env_file:
      - ezptt.env
    # 以主機使用者身分執行，才讀得到 0600 的 PttConfig.csv（映像預設是 uid 10001）。
    # 你的 uid 不是 1000 就設 PUID/PGID。
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # PttConfig.csv／PttConfig.csv.enc lives here; the container only reads it.
      - ./data:/data:ro
      # 金鑰放容器外（ezptt keygen -out ~/.config/ezptt/key），跟帳號檔分開保管。
      - ${HOME}/.config/ezptt:/run/secrets:ro
    logging:
      driver: json-file
      options:
        # A daemon that runs for months must not fill the SD card.
        max-size: "10m"
        max-file: "3"
